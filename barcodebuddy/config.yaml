name: "Kitchen Scanner"
# Bump this on EVERY deploy. It is the only cheap way to tell which build is
# running: the add-on is built from a git branch, so without a bump the version
# string is identical before and after a push and a stale clone is invisible.
version: "2.18.2-beta.9"
# slug is deliberately unchanged from upstream: Home Assistant identifies an
# installed add-on by slug, so renaming it would orphan an existing install
# and its configuration.
slug: "barcodebuddy-python"
description: "Barcode Scanner with Grocy integration - fork: unknown barcodes are auto-created, not queued"
arch:
  - armhf
  - armv7
  - aarch64
  - amd64
  - i386
startup: application
boot: auto
init: false
hassio_api: true
hassio_role: default

# USB-Scanner Zugriff - Multiple scanners supported!
devices:
  - "/dev/input:/dev/input:rwm"
  - "/dev/hidraw0:/dev/hidraw0:rwm"
  - "/dev/hidraw1:/dev/hidraw1:rwm"
  - "/dev/hidraw2:/dev/hidraw2:rwm"
  - "/dev/hidraw3:/dev/hidraw3:rwm"
  - "/dev/hidraw4:/dev/hidraw4:rwm"

udev: true

# /share, not this add-on's /data: /data is destroyed on uninstall, and the
# lookup log is the evidence behind "is a paid provider worth paying for".
# /share survives that and is included in Home Assistant's backups.
map:
  - type: share
    read_only: false

ports:
  "5000/tcp": 5000

webui: "http://[HOST]:[PORT:5000]"
ingress: true
ingress_port: 5000
ingress_entry: "/"
panel_title: "Scanner"
panel_icon: mdi:barcode-scan

options:
  # Grocy Integration
  grocy_url: ""
  grocy_api_key: ""

  # Paperless Grocy Magic Integration (for shared aliases)
  paperless_grocy_magic_url: ""
  enable_alias_integration: true

  # Home Assistant webhook (fork). POSTed on every scan; empty disables it.
  ha_webhook_url: ""

  # Per-device scanner mode (fork). USB "vendor:product" of each gun, e.g.
  # "0581:011a". Leave empty to fall back to the global ADD/CONSUME toggle.
  scanner_add_device: ""
  scanner_consume_device: ""

  # Barcode Configuration
  barcode_add: "BBUDDY-ADD"
  barcode_consume: "BBUDDY-CONSUME"
  barcode_quantity_prefix: "BBUDDY-Q-"

  # One record per provider ATTEMPT, so providers can be compared on the same
  # input. Empty uses the default below.
  lookup_log_path: "/share/kitchen-stack/lookup_log.jsonl"

  # Product Databases (for unknown barcodes)
  enable_openfoodfacts: false
  enable_upcdatabase: true

  # upcdatabase.org needs a key -- without one the lookup is skipped.
  # Free tier is 100/day. https://upcdatabase.org/api
  upcdatabase_api_key: ""

  # USDA FoodData Central. STORED BUT NOT YET USED -- there is deliberately no
  # USDA provider in the chain. Measured 2026-08-25 against nine real barcodes:
  # 2 hits, both ALREADY resolved by a provider twice as fast, and zero added
  # coverage. See BACKLOG.md before wiring it in. The key lives here so it is in
  # one place when that decision is revisited, and so the remaining fuzzy-risk
  # probe can be finished. Free: https://fdc.nal.usda.gov/api-key-signup.html
  usda_api_key: ""

  # Language
  language: "en"

  # Barcode Format for PDF
  barcode_format: "code128"

  # Debug Mode
  debug: false

schema:
  # Grocy Integration
  grocy_url: str
  grocy_api_key: str

  # Paperless Grocy Magic Integration
  paperless_grocy_magic_url: str
  enable_alias_integration: bool

  # Home Assistant webhook (fork)
  ha_webhook_url: str?

  # Per-device scanner mode (fork)
  scanner_add_device: str?
  scanner_consume_device: str?

  # Barcode Configuration
  barcode_add: str
  barcode_consume: str
  barcode_quantity_prefix: str

  lookup_log_path: str?

  # Product Databases
  enable_openfoodfacts: bool
  enable_upcdatabase: bool
  upcdatabase_api_key: str?
  usda_api_key: str?

  # Language (en/de/fr/es)
  language: str

  # Barcode Format (code128/qr)
  barcode_format: list(code128|qr)

  # Debug Mode
  debug: bool
